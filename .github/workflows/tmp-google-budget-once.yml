name: tmp-google-budget-once
on:
  workflow_dispatch:
    inputs:
      code:
        description: "OAuth authorization code"
        required: true
        type: string
jobs:
  q:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GOOGLE_ADS_DEVELOPER_TOKEN: ${{ secrets.GOOGLE_ADS_DEVELOPER_TOKEN }}
      GOOGLE_ADS_CLIENT_ID: ${{ secrets.GOOGLE_ADS_CLIENT_ID }}
      GOOGLE_ADS_CLIENT_SECRET: ${{ secrets.GOOGLE_ADS_CLIENT_SECRET }}
      GOOGLE_ADS_LOGIN_CUSTOMER_ID: ${{ secrets.GOOGLE_ADS_LOGIN_CUSTOMER_ID }}
      GOOGLE_ADS_CUSTOMER_IDS: ${{ secrets.GOOGLE_ADS_CUSTOMER_IDS }}
      AUTH_CODE: ${{ inputs.code }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install "google-ads>=24.0.0,<36.0.0" requests
      - name: exchange and query
        run: |
          python - <<'PY'
          import os, json, requests
          from google.ads.googleads.client import GoogleAdsClient

          CODE = os.environ["AUTH_CODE"].strip()
          if "%" in CODE or "code=" in CODE:
              import urllib.parse as up
              qs = up.parse_qs(up.urlparse(CODE).query or CODE)
              CODE = qs.get("code", [CODE])[0]
          print("code_len:", len(CODE))

          r = requests.post("https://oauth2.googleapis.com/token", data={
              "code": CODE,
              "client_id": os.environ["GOOGLE_ADS_CLIENT_ID"],
              "client_secret": os.environ["GOOGLE_ADS_CLIENT_SECRET"],
              "redirect_uri": "https://chatgpt.com/connector_platform_oauth_redirect",
              "grant_type": "authorization_code",
          }, timeout=30)
          if r.status_code != 200:
              print("EXCHANGE_FAIL", r.status_code, r.text[:400]); raise SystemExit(1)
          rt = r.json()["refresh_token"]
          print("::add-mask::" + rt)
          print("exchange ok, refresh_token received (masked)")

          cfg = {
              "developer_token": os.environ["GOOGLE_ADS_DEVELOPER_TOKEN"],
              "client_id": os.environ["GOOGLE_ADS_CLIENT_ID"],
              "client_secret": os.environ["GOOGLE_ADS_CLIENT_SECRET"],
              "refresh_token": rt,
              "login_customer_id": os.environ["GOOGLE_ADS_LOGIN_CUSTOMER_ID"],
              "use_proto_plus": True,
          }
          client = GoogleAdsClient.load_from_dict(cfg)
          svc = client.get_service("GoogleAdsService")

          NAMES = {"8385977843": "jelenew-Q&M", "5188331105": "Jelenew Cycling-1"}
          for cid in [c.strip() for c in os.environ["GOOGLE_ADS_CUSTOMER_IDS"].split(",") if c.strip()]:
              print("\n" + "="*24, cid, NAMES.get(cid, ""))

              labels = {}
              try:
                  for r0 in svc.search(customer_id=cid, query="SELECT label.id, label.name FROM label"):
                      labels[r0.label.resource_name] = r0.label.name
              except Exception as e:
                  print("label list failed:", repr(e)[:200])
              print("account labels:", list(labels.values()))

              q = ("SELECT campaign.id, campaign.name, campaign.status, campaign.advertising_channel_type, "
                   "campaign_budget.resource_name, campaign_budget.name, campaign_budget.amount_micros, "
                   "campaign_budget.explicitly_shared, campaign_budget.period, campaign.labels "
                   "FROM campaign")
              rows = []
              try:
                  rows = list(svc.search(customer_id=cid, query=q))
              except Exception as e:
                  print("campaign query failed:", repr(e)[:300]); continue

              total_all = 0.0; total_enabled = 0.0; dedup = {}
              jel_rows = []
              for rr in rows:
                  b = rr.campaign_budget.amount_micros / 1_000_000
                  labs = [labels.get(l, l.rsplit("/",1)[-1]) for l in rr.campaign.labels]
                  if not any("jelenew" in x.lower() for x in labs):
                      continue
                  st = rr.campaign.status.name
                  total_all += b
                  if st == "ENABLED": total_enabled += b
                  dedup[rr.campaign_budget.resource_name] = b
                  jel_rows.append((rr.campaign.name, st, b, rr.campaign_budget.explicitly_shared,
                                   rr.campaign_budget.resource_name.rsplit("/",1)[-1],
                                   rr.campaign.advertising_channel_type.name))
              jel_rows.sort(key=lambda x: -x[2])
              print(f"jelenew campaigns: {len(jel_rows)} (enabled {sum(1 for r2 in jel_rows if r2[1]=='ENABLED')})")
              print(f"SUM_ALL_STATUS = {total_all:.2f}")
              print(f"SUM_ENABLED    = {total_enabled:.2f}")
              print(f"SUM_DEDUP_BUDGET_RESOURCE = {sum(dedup.values()):.2f}  (unique budgets {len(dedup)})")
              print("detail:")
              for x in jel_rows:
                  print(f"  {x[1]:9s} ${x[2]:>8.2f} shared={str(x[3]):5s} {x[5]:18s} {x[0][:60]}  bres={x[4]}")
          PY
